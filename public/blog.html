<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog | Codomax Internship</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <nav>
        <div class="logo">Codomax Intern</div>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="blog.html">Blog</a>
        </div>
      </nav>
    </header>

    <main>
      <h1 class="page-title">Blog</h1>

      <section class="add-blog-form">
        <h2>Add New Blog Post</h2>
        <form id="blogForm" novalidate>
          <div class="form-group">
            <label for="blogTitle">Title</label>
            <input
              type="text"
              id="blogTitle"
              name="blogTitle"
              placeholder="Enter blog title"
            />
            <span class="error-message" id="titleError"></span>
          </div>

          <div class="form-group">
            <label for="blogAuthor">Author</label>
            <input
              type="text"
              id="blogAuthor"
              name="blogAuthor"
              placeholder="Enter author name"
            />
            <span class="error-message" id="authorError"></span>
          </div>

          <div class="form-group">
            <label for="blogContent">Content</label>
            <textarea
              id="blogContent"
              name="blogContent"
              rows="4"
              placeholder="Write your blog content"
            ></textarea>
            <span class="error-message" id="contentError"></span>
          </div>

          <button type="submit" class="btn-primary">Publish Blog</button>
        </form>
      </section>

      <section class="blog-grid">
        <!-- Blog cards are loaded dynamically from the backend via script.js -->
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Rahul | Codomax Digital Solutions Internship</p>
    </footer>

    <script src="js/script.js"></script>
  </body>
</html>
