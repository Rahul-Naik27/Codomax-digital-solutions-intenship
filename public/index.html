<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home | Codomax Internship</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <nav>
        <div class="logo">Codomax Intern</div>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="blog.html">Blog</a>
        </div>
      </nav>
    </header>

    <main>
      <section class="hero">
        <h1>Welcome to My Internship Project</h1>
        <p>
          This is the Home page, built as part of the Codomax Digital Solutions
          Full Stack Internship.
        </p>
        <button class="btn-primary">Learn More</button>
      </section>

      <section class="home-blogs">
        <h2>Latest Blog Posts</h2>
        <div class="blog-grid" id="homeBlogGrid">
          <!-- Blog cards loaded dynamically via script.js -->
        </div>
      </section>

      <section class="contact-form">
        <h2>Get in Touch</h2>
        <form>
          <div class="form-group">
            <label for="name">Name</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Enter your name"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
              required
            />
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea
              id="message"
              name="message"
              rows="4"
              placeholder="Your message"
            ></textarea>
          </div>

          <button type="submit" class="btn-primary">Send Message</button>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Rahul | Codomax Digital Solutions Internship</p>
    </footer>

    <script src="js/script.js"></script>
  </body>
</html>
